# Rebuild the crawlable design pages, sitemap and llms.txt whenever the catalog changes
# (e.g. after a new catalog is published from admin.html).
name: Build SEO pages
on:
  push:
    branches: [main]
    paths: [data/catalog.json, tools/build_seo.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/build_seo.py
      - name: Commit if changed
        run: |
          git config user.name "sparsh360-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs sitemap.xml sitemap.txt llms.txt
          git diff --cached --quiet || git commit -m "Rebuild SEO pages from catalog"
          git push
