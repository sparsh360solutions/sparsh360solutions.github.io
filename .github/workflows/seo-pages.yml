# Rebuild the crawlable design pages, sitemap and llms.txt whenever the catalog changes
# (e.g. after a new catalog is published from admin.html).
name: Build SEO pages
on:
  push:
    branches: [main]
    paths: [data/catalog.json, tools/build_seo.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/build_seo.py
      - name: Commit if changed
        run: |
          git config user.name "sparsh360-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs sitemap.xml sitemap.txt llms.txt
          git diff --cached --quiet || git commit -m "Rebuild SEO pages from catalog"
          git push
